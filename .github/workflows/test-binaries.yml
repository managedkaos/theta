name: Test Binaries (reusable)

on:
  workflow_call:
    inputs:
      artifact_name:
        required: false
        type: string
        default: 'dist'
      binary_name:
        required: false
        type: string
        default: 'theta'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ''
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            ext: ''
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            ext: ''
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ''
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: '.exe'
    runs-on: ${{ matrix.runner }}
    env:
      # GoReleaser archive base name, e.g. theta-linux-amd64
      ARCHIVE_BASE: ${{ format('{0}-{1}-{2}', inputs.binary_name, matrix.os, matrix.arch) }}
      BIN: ${{ format('{0}{1}', inputs.binary_name, matrix.ext) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts

      - name: List downloaded files (non-windows)
        if: matrix.os != 'windows'
        run: ls -la artifacts || true

      - name: List downloaded files (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: Get-ChildItem -Path artifacts | Format-List

      # linux/darwin archives are .tar.gz; windows is .zip. Extract the raw
      # binary next to the archive, then run its --version as a smoke test.
      - name: Extract and smoke test (non-windows)
        if: matrix.os != 'windows'
        run: |
          set -euo pipefail
          tar -xzf "artifacts/${ARCHIVE_BASE}.tar.gz" -C artifacts
          chmod +x "artifacts/${BIN}"
          echo "Running artifacts/${BIN} --version"
          "./artifacts/${BIN}" --version
          printf 'one\ntwo\nthree\n' > sample.txt
          "./artifacts/${BIN}" -h 1 --tail 1 --color never sample.txt > actual.txt
          printf 'sample.txt\n     1 | one\n--------------------\n     3 | three\n' > expected.txt
          diff -u expected.txt actual.txt

      - name: Extract and smoke test (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path "artifacts/$env:ARCHIVE_BASE.zip" -DestinationPath artifacts -Force
          Write-Host "Running .\artifacts\$env:BIN --version"
          & ".\artifacts\$env:BIN" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [IO.File]::WriteAllText("$pwd/sample.txt", "one`ntwo`nthree`n")
          $actual = & ".\artifacts\$env:BIN" -h 1 --tail 1 --color never sample.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @('sample.txt', '     1 | one', '--------------------', '     3 | three')
          if (($actual -join "`n") -cne ($expected -join "`n")) { throw 'Unexpected head/tail output' }

      - name: Upload test log
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-log-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts
